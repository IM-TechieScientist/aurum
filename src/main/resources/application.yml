spring:
  application:
    name: aurum
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aurum}
    username: ${DB_USER:aurum}
    password: ${DB_PASSWORD:aurum}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

