services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - aurum-postgres:/var/lib/postgresql/data

volumes:
  aurum-postgres:

